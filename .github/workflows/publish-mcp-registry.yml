name: publish-mcp-registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Require matching published package
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' server.json)"
          package_version="$(jq -r '.packages[0].version' server.json)"
          test "$version" = "$package_version"
          test "v$version" = "$RELEASE_TAG"
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG"
          curl -fsS "https://pypi.org/pypi/subagent-harness-mcp/$version/json" >/dev/null
      - name: Install pinned MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish MCP Registry metadata
        run: ./mcp-publisher publish server.json
